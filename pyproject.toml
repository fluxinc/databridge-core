[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphik"
version = "0.1.0"
description = "A description of your project"
authors = [
  { name="Your Name", email="you@example.com" },
]
requires-python = ">=3.8"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
fixable = ["ALL"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__.py files
